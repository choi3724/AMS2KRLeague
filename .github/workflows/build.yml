name: Build Player Overlay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\AMS2KRLeague.sln
      - name: Build
        run: dotnet build .\AMS2KRLeague.sln -c Release --no-restore
